version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - nilerr
    - bodyclose
    - noctx
    - nolintlint
    - errorlint
    - testifylint
    - modernize
    - testpackage
    - funcorder
    # revive is not enabled: its exported and package-comments rules require a comment
    # on every exported identifier and every package, which conflicts with writing
    # comments only where the code cannot express the intent.
    - gocritic
    - exhaustive
    - copyloopvar
    - misspell
  settings:
    staticcheck:
      # staticcheck skips style checks such as ST1003 (identifier naming) by default;
      # enable them explicitly here as the detection basis for NAMING-001/002/003
      # and CONST-001. ST1000 and ST1020-ST1023 depend on doc comments and stay off,
      # consistent with writing comments only where the code cannot express the intent.
      checks:
        - "all"
        - "-ST1000"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-ST1023"
    testifylint:
      enable-all: true
      disable:
        - expected-actual
    nolintlint:
      # Suppressing a warning must name the linter and state the reason; see TOOL-009.
      require-specific: true
      require-explanation: true
      allow-unused: false
    funcorder:
      # Constructor placement (right after the type declaration) is only "may" in Uber, not enforced.
      constructor: false
      function: true

formatters:
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ForeverSRC/golang-dev-manual)

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
