site_name: Golang 开发手册
site_url: https://foreversrc.github.io/golang-dev-manual/
repo_url: https://github.com/ForeverSRC/golang-dev-manual

docs_dir: ../manual
site_dir: ../.site

hooks:
  - hooks/clause_style.py

theme:
  name: material
  language: zh
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          default: true
          name: 中文
        - locale: en
          name: English
          site_name: Golang Development Manual

extra_css:
  - assets/extra.css

markdown_extensions:
  - attr_list
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.superfences
